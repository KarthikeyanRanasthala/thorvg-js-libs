[binaries]
cpp = 'EMSDK/bin/em++'
ar = 'EMSDK/bin/emar'
strip = '-strip'

[properties]
root = 'EMSDK/libexec/system'
shared_lib_suffix = 'js'
static_lib_suffix = 'js'
shared_module_suffix = 'js'
exe_suffix = 'js'

[built-in options]
cpp_args = ['-Wshift-negative-value', '-flto','-O3', '-fno-exceptions']
cpp_link_args = ['-Wshift-negative-value', '-flto', '-O3', '-fno-exceptions', '--bind', '-sWASM=1', '-sALLOW_MEMORY_GROWTH=1', '-sASSERTIONS=0', '-sEXPORT_ES6=1', '-sMODULARIZE=1', '-sSINGLE_FILE=0', '-sENVIRONMENT=web', '-sUSE_WEBGL2=1', '-sMAX_WEBGL_VERSION=2', '-sMIN_WEBGL_VERSION=2', '-sEXPORTED_RUNTIME_METHODS=HEAPU8,HEAPF32,UTF8ToString,stringToUTF8,lengthBytesUTF8,addFunction,removeFunction', '-sEXPORTED_FUNCTIONS=_malloc,_free,_tvg_engine_init,_tvg_engine_term,_tvg_swcanvas_create,_tvg_swcanvas_set_target,_tvg_glcanvas_create,_tvg_glcanvas_set_target,_tvg_webgl_create_context,_tvg_canvas_push,_tvg_canvas_push_at,_tvg_canvas_remove,_tvg_canvas_update,_tvg_canvas_draw,_tvg_canvas_sync,_tvg_canvas_destroy,_tvg_shape_new,_tvg_shape_reset,_tvg_shape_append_rect,_tvg_shape_append_circle,_tvg_shape_move_to,_tvg_shape_line_to,_tvg_shape_cubic_to,_tvg_shape_close,_tvg_shape_append_path,_tvg_shape_set_fill_rule,_tvg_shape_set_fill_color,_tvg_shape_set_stroke_color,_tvg_shape_set_stroke_width,_tvg_shape_set_stroke_dash,_tvg_shape_set_stroke_cap,_tvg_shape_set_stroke_join,_tvg_shape_set_stroke_miterlimit,_tvg_scene_new,_tvg_scene_push,_tvg_scene_push_at,_tvg_scene_remove,_tvg_paint_set_transform,_tvg_paint_get_transform,_tvg_paint_set_opacity,_tvg_paint_get_type,_tvg_accessor_new,_tvg_accessor_del,_tvg_accessor_set,_tvg_accessor_generate_id', '-sALLOW_TABLE_GROWTH=1', '-sRESERVED_FUNCTION_POINTERS=10', '--js-library', '../../webgl_helper.js', '--emit-tsd', 'thorvg.d.ts']


[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
