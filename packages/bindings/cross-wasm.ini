[binaries]
cpp = 'EMSDK/bin/em++'
ar = 'EMSDK/bin/emar'
strip = '-strip'

[properties]
root = 'EMSDK/libexec/system'
shared_lib_suffix = 'js'
static_lib_suffix = 'js'
shared_module_suffix = 'js'
exe_suffix = 'js'

[built-in options]
cpp_args = ['-Wshift-negative-value', '-flto', '-Oz', '-fno-exceptions']
cpp_link_args = ['-Wshift-negative-value', '-flto', '-Oz', '-fno-exceptions', '--bind', '--closure=1', '-sWASM=1', '-sALLOW_MEMORY_GROWTH=1', '-sEXPORT_ES6=1', '-sMODULARIZE=1', '-sSINGLE_FILE=0', '-sEXPORTED_RUNTIME_METHODS=cwrap,ccall,getValue,setValue', '-sEXPORTED_FUNCTIONS=_malloc,_free,_tvg_engine_init,_tvg_engine_term,_tvg_swcanvas_create,_tvg_swcanvas_set_target,_tvg_canvas_push,_tvg_canvas_push_at,_tvg_canvas_remove,_tvg_canvas_update,_tvg_canvas_draw,_tvg_canvas_sync,_tvg_canvas_destroy,_tvg_shape_new,_tvg_shape_reset,_tvg_shape_append_rect,_tvg_shape_append_circle,_tvg_shape_set_fill_color,_tvg_shape_set_stroke_color,_tvg_shape_set_stroke_width,_tvg_scene_new,_tvg_scene_push,_tvg_scene_push_at,_tvg_scene_remove,_tvg_paint_set_transform,_tvg_paint_get_transform,_tvg_paint_set_opacity', '--emit-tsd', 'thorvg.d.ts']


[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
