<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thorvg-js-libs/bindings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      #gl-canvas {
        width: 500px;
        height: 500px;
        margin-top: 20px;
        border: 2px solid #333;
      }
      h1 {
        font-family: system-ui, -apple-system, sans-serif;
        margin-bottom: 10px;
      }
      .info {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>ThorVG WebGL Renderer Demo</h1>
      <div class="info">Using WebGL2 for hardware-accelerated rendering</div>
      <canvas id="gl-canvas"></canvas>
    </div>
    <script type="module">
      import { loadWasm, Engine, GlCanvas, Shape, TvgColorspace } from "./src";

      const canvasElement = document.getElementById("gl-canvas");

      // Check for WebGL2 support
      if (!canvasElement.getContext("webgl2")) {
        document.querySelector(".info").textContent =
          "WebGL2 is not supported in your browser!";
        throw new Error("WebGL2 not supported");
      }

      // Set canvas size before creating GL context
      canvasElement.width = 500;
      canvasElement.height = 500;

      const ctx = await loadWasm({});

      const engine = new Engine(ctx);
      engine.init();

      // Create WebGL canvas - it gets the WebGL2 context internally
      const canvas = new GlCanvas(ctx, "#gl-canvas");
      canvas.setTarget(500, 500, TvgColorspace.ABGR8888S);

      const rect = new Shape(ctx);
      rect
        .appendRect(140, 200, 100, 100)
        .fill(255, 0, 0, 255)
        .stroke(0, 0, 0, 255)
        .strokeWidth(6);

      const circle = new Shape(ctx);
      circle
        .appendCircle(310, 250, 50, 50)
        .fill(0, 128, 255, 255)
        .stroke(0, 0, 0, 255)
        .strokeWidth(6);

      canvas.push(rect.handle);
      canvas.push(circle.handle);
      canvas.update();
      canvas.draw();
      canvas.sync();

      // WebGL renders directly to canvas - no need to copy pixels!

      canvas.destroy();
      engine.term();
    </script>
  </body>
</html>
