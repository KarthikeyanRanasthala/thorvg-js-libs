<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thorvg-js-libs/bindings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      #gl-canvas {
        width: 500px;
        height: 500px;
        margin-top: 20px;
        border: 2px solid #333;
      }
      h1 {
        font-family: system-ui, -apple-system, sans-serif;
        margin-bottom: 10px;
      }
      .info {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>ThorVG WebGL Renderer Demo</h1>
      <div class="info">Using WebGL2 for hardware-accelerated rendering</div>
      <canvas id="gl-canvas"></canvas>
    </div>
    <script type="module">
      import {
        Engine,
        GlCanvas,
        GlModuleFactory,
        Shape,
        PathCommand,
        FillRule,
        TvgColorspace,
      } from "./src";

      const canvasElement = document.getElementById("gl-canvas");

      if (!canvasElement) {
        throw new Error("Canvas element not found");
      }

      // Set canvas size before creating GL context
      canvasElement.width = 500;
      canvasElement.height = 500;

      const module = await GlModuleFactory({
        locateFile: (path) => {
          return `./wasm/thorvg-gl.wasm`;
        },
      });

      const engine = new Engine(module);
      engine.init();

      // Create WebGL canvas - it gets the WebGL2 context internally
      const canvas = new GlCanvas(module, "#gl-canvas");
      canvas.setTarget(500, 500, TvgColorspace.ABGR8888S);

      const rect = new Shape(module);
      rect
        .appendRect(140, 200, 100, 100)
        .fill(255, 0, 0, 255)
        .stroke(0, 0, 0, 255)
        .strokeWidth(6);

      const circle = new Shape(module);
      circle
        .appendCircle(310, 250, 50, 50)
        .fill(0, 128, 255, 255)
        .stroke(0, 0, 0, 255)
        .strokeWidth(6);

      // Triangle using Path commands
      const triangle = new Shape(module);
      triangle
        .appendPath(
          [PathCommand.MoveTo, PathCommand.LineTo, PathCommand.LineTo, PathCommand.Close],
          [
            { x: 250, y: 350 },  // Start at top
            { x: 200, y: 430 },  // Bottom left
            { x: 300, y: 430 },  // Bottom right
          ]
        )
        .fill(0, 255, 0, 255)
        .stroke(0, 0, 0, 255)
        .strokeWidth(4);

      // Curved path using CubicTo
      const curve = new Shape(module);
      curve
        .appendPath(
          [PathCommand.MoveTo, PathCommand.CubicTo, PathCommand.LineTo, PathCommand.Close],
          [
            { x: 100, y: 350 },  // Start point
            { x: 50, y: 380 },   // Control point 1
            { x: 50, y: 420 },   // Control point 2
            { x: 100, y: 450 },  // End point
            { x: 150, y: 400 },  // Line to
          ]
        )
        .fill(255, 0, 255, 255)
        .fillRule(FillRule.NonZero)
        .stroke(0, 0, 0, 255)
        .strokeWidth(3);

      canvas.push(rect.handle);
      canvas.push(circle.handle);
      canvas.push(triangle.handle);
      canvas.push(curve.handle);
      canvas.update();
      canvas.draw();
      canvas.sync();

      // WebGL renders directly to canvas - no need to copy pixels!

      canvas.destroy();
      engine.term();
    </script>
  </body>
</html>
